<!DOCTYPE html>
<!--
  Roots · Forest Dashboard — navegador de árbol sobre state.json (ver collect.py).
  NAVEGABLE por VIÑETAS: home = grilla de cards (repos); click → página interna
  del nodo (HERO de Cambios + TABS Tareas/Docs + Skills/Hooks colapsados) + grilla
  de viñetas hijas (subproyectos = .roots anidados, recursivo por click + breadcrumb).
  Mapea a Odoo: viñeta→kanban card, página→ir.actions.client, árbol→odoo_moldeo_htree.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roots · Forest Dashboard</title>
<style>
  :root{--bg:#0b0f14;--panel:#1a212b;--panel2:#252e3a;--border:#3d4753;
    --txt:#eef2f6;--muted:#b3bdc8;--accent:#79c0ff;
    --green:#5fd874;--yellow:#e3b341;--red:#ff8077;--purple:#d8b4ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{position:sticky;top:0;z-index:9;background:var(--panel);
    border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;color:#fff;font-weight:600;cursor:pointer}
  .sp{flex:1}
  .pill{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent);color:#fff}
  label.auto{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  main{padding:16px;max-width:1200px;margin:0 auto}
  .ic{width:20px;height:20px;border-radius:5px;vertical-align:middle;object-fit:cover;background:#0008;flex:none}
  .ic.lg{width:34px;height:34px}
  /* breadcrumb */
  .crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:14px}
  .crumb a{color:var(--accent);text-decoration:none;cursor:pointer}
  .crumb a:hover{text-decoration:underline}
  /* metrics */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px}
  .metric .n{font-size:24px;color:#fff;font-weight:600}
  .metric .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  /* viñetas (grid de cards) */
  h2.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:22px 0 12px;display:flex;gap:8px;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .vin{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;
    transition:border-color .12s,transform .12s;display:flex;flex-direction:column;gap:8px;min-height:96px}
  .vin:hover{border-color:var(--accent);transform:translateY(-2px)}
  .vin .h{display:flex;align-items:center;gap:9px}
  .vin .t{color:#fff;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vin .v{color:var(--muted);font-size:11px}
  .vin .d{color:var(--txt);opacity:.82;font-size:11.5px;line-height:1.4;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vin .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .b{font-size:11px;border-radius:4px;padding:1px 7px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .b.tasks{color:var(--accent);border-color:var(--accent)}
  .b.docs{color:var(--purple);border-color:var(--purple)}
  .b.errors{color:var(--red);border-color:var(--red)}
  .b.kids{color:var(--green);border-color:var(--green)}
  .b.date{margin-left:auto;border:none}
  /* página de nodo */
  .nodehead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .nodehead .tt{font-size:20px;color:#fff;font-weight:600}
  .nodehead .vv{color:var(--muted);font-size:12px}
  .nodedesc{color:var(--muted);margin-bottom:14px}
  a.desc{font-size:11px;color:var(--green);text-decoration:none;border:1px solid var(--green);border-radius:5px;padding:2px 8px}
  a.desc:hover{background:#3fb95022}
  .wchip{font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted)}
  /* HERO cambios */
  .hero{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 14px;margin-bottom:16px}
  .change{padding:9px 0;border-top:1px solid #21262d}
  .change:first-child{border-top:none}
  .change .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cdate{color:var(--accent);font-weight:700;font-size:12px}
  .cmod{color:var(--purple);font-size:11px;font-weight:600}
  .csum{color:#fff;font-weight:500}
  .cbody{color:var(--txt);font-size:12.5px;margin-top:4px;opacity:.9}
  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:7px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--txt);border-radius:8px 8px 0 0;font-weight:600}
  .tab.on{background:var(--panel);border-color:var(--border);color:#fff}
  .tab.danger{color:var(--red)}
  .tab.danger.on{border-color:var(--red);color:var(--red)}
  .tcount{font-size:11px;color:var(--muted)}
  .mgroup{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;padding:8px 12px}
  .mgroup.err{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
  .mgroup .gh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .task{color:var(--txt);padding:2px 0 2px 18px;font-size:13px}
  .frow{cursor:pointer;padding:3px 0;color:var(--accent)}
  .frow:hover{color:#fff}
  .fbody{margin:4px 0 8px;border-left:2px solid var(--border);padding-left:12px}
  .hidden{display:none}
  .muted{color:var(--muted);font-size:12px}
  details.coll{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-top:8px}
  details.coll>summary{padding:9px 12px;cursor:pointer;color:var(--muted)}
  .grouplbl{color:var(--muted);font-size:10px;letter-spacing:1px;margin:8px 0 2px}
  button.more{margin:6px 0 4px}
  /* markdown */
  .md{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);font-size:13px}
  .md h1,.md h2,.md h3,.md h4{color:#fff;margin:.6em 0 .3em;line-height:1.3}
  .md h1{font-size:1.4em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
  .md code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:.92em}
  .md pre{background:#0b0f15;border:1px solid var(--border);border-radius:6px;padding:10px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md table{border-collapse:collapse;margin:.5em 0;width:100%}
  .md th,.md td{border:1px solid var(--border);padding:4px 8px;text-align:left}
  .md th{background:var(--panel2);color:#fff}
  .md blockquote{border-left:3px solid var(--purple);margin:.4em 0;padding:2px 10px;color:var(--muted)}
  .md hr{border:none;border-top:1px solid var(--border);margin:.8em 0}
  .md a{color:var(--accent)}.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
  #err{color:var(--red);padding:10px}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  /* nav + forest map */
  .navbtn.on{border-color:var(--accent);color:#fff;background:var(--panel2)}
  .grove{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
  .grove>.gt{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .grove .gname{color:#fff;font-weight:600;font-size:14px}
  .btag{font-size:10px;border-radius:4px;padding:1px 6px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .btag.kind{color:var(--yellow);border-color:var(--yellow)}
  .btag.vendor{color:var(--purple);border-color:var(--purple)}
  .tree-row{display:flex;align-items:center;gap:7px;padding:4px 0;flex-wrap:wrap;border-top:1px solid #21262d}
  .tree-row:first-child{border-top:none}
  .tree-row .tn{color:var(--txt);font-weight:600;font-size:13px}
  .brch{font-size:10px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:0 5px}
  svg.graph{width:100%;height:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 2px}
  .legend i{display:inline-block;width:18px;border-top:2px solid;vertical-align:middle;margin-right:5px}
  /* home tree (bonsai generativo) */
  .treehero{background:linear-gradient(180deg,#0d1117,#11161d);border:1px solid var(--border);border-radius:12px;padding:6px 6px 2px;margin-bottom:16px}
  svg.tree{width:100%;height:auto;display:block}
  .treecap{text-align:center;color:var(--muted);font-size:11px;padding:2px 0 6px}
  .grovegrp{cursor:pointer}
  .grovegrp .ghit{fill:transparent}
  .grovegrp:hover .ghit{fill:#ffffff14}
  .clrfil{color:var(--accent);cursor:pointer;font-size:11px;border:1px solid var(--accent);border-radius:5px;padding:1px 7px;margin-left:8px}
</style>
</head>
<body>
<header>
  <h1 id="home">🌲 Roots · Forest Dashboard</h1>
  <button id="navFeed" class="navbtn">Feed</button>
  <button id="navForest" class="navbtn">🌲 Forest map</button>
  <span class="pill" id="ws">—</span>
  <span class="sp"></span>
  <span class="pill" id="stamp">cargando…</span>
  <label class="auto"><input type="checkbox" id="auto"> auto</label>
  <button id="refresh">↻ refrescar</button>
</header>
<main>
  <div id="err"></div>
  <div id="view"></div>
</main>
<script>
const $=(s,el=document)=>el.querySelector(s);
const E=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const TOKEN=new URLSearchParams(location.search).get('token');
const HERO_FIRST=3, HERO_STEP=3;
let STATE=null, TREE=null, pollMs=20000, timer=null, groveFilter=null;

function fileURL(p){return '/file?path='+encodeURIComponent(p)+(TOKEN?'&token='+encodeURIComponent(TOKEN):'');}
function iconImg(icon,cls){if(!icon)return null;const im=E('img','ic'+(cls?' '+cls:''));im.src=fileURL(icon);im.loading='lazy';im.onerror=()=>im.remove();return im;}
function metric(n,l){const m=E('div','metric');m.append(E('div','n',String(n)),E('div','l',l));return m;}

/* ---------- markdown mínimo ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inl(s){s=esc(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return s;}
function renderTbl(rows){const sep=r=>/^[\s|:\-]+$/.test(r)&&r.includes('-');
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inl(c.trim()));
  let out='<table>',head=false;for(const r of rows){if(sep(r)){head=true;continue;}const tag=head?'td':'th';
    out+='<tr>'+cells(r).map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';}return out+'</table>';}
function mdToHtml(src){const lines=src.replace(/\r/g,'').split('\n');let html='',inC=false,buf='',lt=null,tbl=null;
  const cl=()=>{if(lt){html+='</'+lt+'>';lt=null;}},ct=()=>{if(tbl){html+=renderTbl(tbl);tbl=null;}};
  for(const line of lines){
    if(/^```/.test(line)){if(inC){html+='<pre><code>'+esc(buf)+'</code></pre>';buf='';inC=false;}else{cl();ct();inC=true;}continue;}
    if(inC){buf+=(buf?'\n':'')+line;continue;}
    if(/^\s*\|.*\|\s*$/.test(line)){cl();(tbl=tbl||[]).push(line);continue;}else ct();
    if(/^\s*---+\s*$/.test(line)){cl();html+='<hr>';continue;}
    let h=line.match(/^(#{1,6})\s+(.*)$/);if(h){cl();const n=h[1].length;html+=`<h${n}>${inl(h[2])}</h${n}>`;continue;}
    let bq=line.match(/^>\s?(.*)$/);if(bq){cl();html+='<blockquote>'+inl(bq[1])+'</blockquote>';continue;}
    let ul=line.match(/^\s*[-*]\s+(.*)$/),ol=line.match(/^\s*\d+\.\s+(.*)$/);
    if(ul){if(lt!=='ul'){cl();html+='<ul>';lt='ul';}const cb=ul[1].match(/^\[([ xX])\]\s+(.*)$/);
      html+=cb?('<li>'+(cb[1].trim()?'☑':'☐')+' '+inl(cb[2])+'</li>'):('<li>'+inl(ul[1])+'</li>');continue;}
    if(ol){if(lt!=='ol'){cl();html+='<ol>';lt='ol';}html+='<li>'+inl(ol[1])+'</li>';continue;}
    if(!line.trim()){cl();continue;}cl();html+='<p>'+inl(line)+'</p>';}
  cl();ct();if(inC)html+='<pre><code>'+esc(buf)+'</code></pre>';return html;}

async function loadFile(path,mount){if(mount.dataset.loaded){mount.classList.toggle('hidden');return;}
  mount.dataset.loaded='1';mount.textContent='cargando…';
  try{const r=await fetch(fileURL(path));mount.innerHTML='<div class="md">'+mdToHtml(await r.text())+'</div>';}
  catch(e){mount.textContent='error: '+e.message;}}
function fileRow(f){const wrap=E('div');const row=E('div','frow','› '+(f.title||f.name));
  const mount=E('div','fbody hidden');row.onclick=()=>loadFile(f.path,mount);wrap.append(row,mount);return wrap;}

/* ---------- árbol ---------- */
function buildTree(modules){
  const root={name:'Forest',path:'',children:{},mem:null};
  for(const m of modules){
    if(m.path==='.'||m.repo==='workspace'){root.mem=m;continue;}
    let node=root,acc=[];
    for(const seg of m.path.split('/')){acc.push(seg);const key=acc.join('/');
      node.children[seg]=node.children[seg]||{name:seg,path:key,children:{},mem:null};node=node.children[seg];}
    node.mem=m;
  }
  computeAgg(root);return root;
}
function computeAgg(node){
  let mems=node.mem?[node.mem]:[],mt=node.mem?node.mem.mtime:0;
  for(const c of Object.values(node.children)){computeAgg(c);mems=mems.concat(c._mems);mt=Math.max(mt,c._mtime);}
  node._mems=mems;node._mtime=mt;
  node._openTasks=mems.reduce((a,m)=>a+(m.tasks?m.tasks.open_total:0),0);
  node._docs=mems.reduce((a,m)=>a+(m.docs?m.docs.length:0),0);
  node._errors=mems.reduce((a,m)=>a+((m.summary&&m.summary.errors_active)||0),0);
}
function nodeByPath(path){let n=TREE;if(!path)return n;for(const seg of path.split('/')){if(n.children[seg])n=n.children[seg];else return n;}return n;}
function kids(node){return Object.values(node.children).sort((a,b)=>b._mtime-a._mtime);}

function aggCambios(mems){const out=[];for(const m of mems)for(const e of (m.journal||[]))
  out.push({...e,module:m.module,version:m.version,icon:m.icon});
  out.sort((a,b)=>{const k=x=>(x.date_key||[0,0,0]);const A=k(a),B=k(b);
    return (B[0]-A[0])||(B[1]-A[1])||(B[2]-A[2]);});return out;}

/* ---------- viñeta ---------- */
function vinTitle(node){return node.mem?(node.mem.module+(node.mem.version?'':'')):node.name;}
function makeVin(node){
  const v=E('div','vin');v.onclick=()=>go(node.path);
  const h=E('div','h');const icon=node.mem&&node.mem.icon;const im=iconImg(icon);if(im)h.append(im);
  h.append(E('span','t',vinTitle(node)));
  v.append(h);
  const sub=node.mem&&node.mem.version?node.mem.version:(Object.keys(node.children).length+' subproyectos');
  v.append(E('div','v',sub));
  const desc=node.mem&&node.mem.summary&&node.mem.summary.description;
  v.append(E('div','d',desc||''));
  const f=E('div','f');
  const nk=Object.keys(node.children).length;
  if(nk)f.append(E('span','b kids','⊞ '+nk));
  if(node._openTasks)f.append(E('span','b tasks','◑ '+node._openTasks));
  if(node._docs)f.append(E('span','b docs','📄 '+node._docs));
  if(node._errors)f.append(E('span','b errors','⚠ '+node._errors));
  const last=(aggCambios(node._mems)[0]||{}).date_raw;
  if(last)f.append(E('span','b date',last));
  v.append(f);return v;
}
function grid(nodes){const g=E('div','grid');nodes.forEach(n=>g.append(makeVin(n)));return g;}

/* ---------- página de nodo ---------- */
function renderHero(mems,mount){
  const list=aggCambios(mems);const hero=E('div','hero');
  const rows=E('div');hero.append(rows);
  if(!list.length)rows.append(E('div','muted','(sin cambios)'));
  const addRow=c=>{const ch=E('div','change');const top=E('div','top');
    const im=iconImg(c.icon);if(im)top.append(im);
    top.append(E('span','cdate',c.date_raw||''));
    top.append(E('span','cmod',c.module+(c.version?(' · '+c.version):'')));
    top.append(E('span','csum',c.summary||''));ch.append(top);
    if(c.body)ch.append(E('div','cbody',c.body));rows.append(ch);};
  const btn=E('button','more','');let shown=0;
  const more=n=>{list.slice(shown,shown+n).forEach(addRow);shown=Math.min(shown+n,list.length);
    if(shown>=list.length)btn.remove();else btn.textContent='ver más ('+(list.length-shown)+')';};
  btn.onclick=()=>more(HERO_STEP);
  hero.append(btn);
  more(HERO_FIRST);   // arranca mostrando 3; luego suma de a 3
  mount.append(hero);
}
function mgroupHeader(m,extra){const gh=E('div','gh');const im=iconImg(m.icon);if(im)gh.append(im);
  gh.append(E('span','t',m.module+' · '+m.version));if(extra)gh.append(extra);return gh;}
function errCount(m){return (m.summary&&m.summary.errors_active)||0;}

function renderTabs(mems,mount){
  const withTasks=mems.filter(m=>m.tasks&&m.tasks.open_total>0).sort((a,b)=>b.mtime-a.mtime);
  const withDocs=mems.filter(m=>m.docs&&m.docs.length).sort((a,b)=>b.mtime-a.mtime);
  const withDebug=mems.filter(m=>m.debug&&m.debug.length).sort((a,b)=>errCount(b)-errCount(a)||b.mtime-a.mtime);
  const tasksN=mems.reduce((a,m)=>a+(m.tasks?m.tasks.open_total:0),0);
  const errN=mems.reduce((a,m)=>a+errCount(m),0);
  const tabsEl=E('div','tabs');const body=E('div');
  const tabs=[
    {id:'tareas',label:'Tareas',count:tasksN,render:()=>{
      if(!withTasks.length)return E('div','muted','(sin tareas abiertas)');
      const w=E('div');withTasks.forEach(m=>{const g=E('div','mgroup');
        g.append(mgroupHeader(m,E('span','b tasks','◑ '+m.tasks.open_total)));
        m.tasks.open.forEach(x=>g.append(E('div','task','☐ '+x)));
        if(m.tasks.open_total>m.tasks.open.length)g.append(E('div','muted','… +'+(m.tasks.open_total-m.tasks.open.length)+' más'));
        w.append(g);});return w;}},
    {id:'docs',label:'Docs',count:withDocs.reduce((a,m)=>a+m.docs.length,0),render:()=>{
      if(!withDocs.length)return E('div','muted','(sin docs)');
      const w=E('div');withDocs.forEach(m=>{const g=E('div','mgroup');
        const a=m.index_html?(()=>{const x=E('a','desc','ver descripción ↗');x.href=fileURL(m.index_html);x.target='_blank';x.rel='noopener';return x;})():null;
        g.append(mgroupHeader(m,a));m.docs.forEach(f=>g.append(fileRow(f)));w.append(g);});return w;}},
    {id:'debug',label:'Debug',count:errN,danger:errN>0,render:()=>{
      if(!withDebug.length)return E('div','muted','(sin debug)');
      const w=E('div');withDebug.forEach(m=>{const g=E('div','mgroup'+(errCount(m)?' err':''));
        const ea=errCount(m);g.append(mgroupHeader(m,ea?E('span','b errors','⚠ '+ea+' activos'):null));
        m.debug.forEach(f=>g.append(fileRow(f)));w.append(g);});return w;}},
  ];
  let active=errN>0?'debug':'tareas';   // recalcar Debug cuando hay errores activos
  function paint(){body.innerHTML='';const t=tabs.find(x=>x.id===active);body.append(t.render());
    [...tabsEl.children].forEach(c=>c.classList.toggle('on',c.dataset.id===active));}
  tabs.forEach(t=>{const el=E('div','tab'+(t.danger?' danger':''));el.dataset.id=t.id;
    el.append(E('span',null,t.label),E('span','tcount',' '+t.count));
    el.onclick=()=>{active=t.id;paint();};tabsEl.append(el);});
  mount.append(tabsEl,body);paint();
}
function renderCollapsed(mems,mount){
  const list=mems.filter(m=>(m.skills&&m.skills.length)||(m.hooks&&m.hooks.length));
  if(!list.length)return;
  const d=E('details','coll');d.append(E('summary',null,'Skills · Hooks ('+list.length+' módulos)'));
  list.forEach(m=>{const g=E('div','mgroup');g.append(mgroupHeader(m));
    [['skills',m.skills],['hooks',m.hooks]].forEach(([lbl,arr])=>{if(!arr||!arr.length)return;
      g.append(E('div','grouplbl',lbl.toUpperCase()));arr.forEach(f=>g.append(fileRow(f)));});
    d.append(g);});
  mount.append(d);
}

function crumb(path){
  const c=E('div','crumb');const a0=E('a',null,'⌂ Forest');a0.onclick=()=>go('');c.append(a0);
  let acc=[];if(path)for(const seg of path.split('/')){acc.push(seg);const key=acc.join('/');
    c.append(E('span',null,'/'));const a=E('a',null,seg);a.onclick=()=>go(key);c.append(a);}
  return c;
}

function renderNode(path){
  const node=nodeByPath(path);const view=$('#view');view.innerHTML='';
  // HOME: métricas + (hero global opcional)
  if(!path){
    const th=homeTree(STATE.groves||[],STATE.repos||[]);if(th)view.append(th);
    const m=E('div','metrics');const mt=STATE.metrics;
    m.append(metric(mt.trees||mt.repos,'Trees'),metric(mt.groves||0,'Groves'),
      metric(mt.modules_with_memory,'módulos c/ memoria'),
      metric(mt.open_tasks_total,'tareas abiertas'),metric(mt.wip_branches,'branches WIP'));
    view.append(m);
  } else {
    view.append(crumb(path));
    const head=E('div','nodehead');const icon=node.mem&&node.mem.icon;const im=iconImg(icon,'lg');if(im)head.append(im);
    head.append(E('span','tt',vinTitle(node)));
    if(node.mem&&node.mem.version)head.append(E('span','vv',node.mem.version));
    if(node.mem&&node.mem.index_html){const a=E('a','desc','ver descripción ↗');a.href=fileURL(node.mem.index_html);a.target='_blank';a.rel='noopener';head.append(a);}
    if(node.mem&&node.mem.git){const g=node.mem.git;let t=g.branch||'';if(g.dirty)t+=' ●'+g.dirty;if(g.ahead)t+=' ↑'+g.ahead;if(g.behind)t+=' ↓'+g.behind;head.append(E('span','wchip',t));}
    if(node._errors)head.append(E('span','b errors','⚠ '+node._errors+' errores activos'));
    view.append(head);
    const desc=node.mem&&node.mem.summary&&node.mem.summary.description;
    if(desc)view.append(E('div','nodedesc',desc));
  }
  // viñetas hijas (navegación recursiva) — en la home, filtrables por Grove
  let ch=kids(node);
  if(!path&&groveFilter){const gb=STATE._groveByRepo||{};ch=ch.filter(n=>gb[n.name]===groveFilter);}
  if(ch.length||(!path&&groveFilter)){
    let hdr;
    if(path)hdr=E('h2','sec','Subproyectos');
    else if(groveFilter){hdr=E('h2','sec');hdr.append(E('span',null,'Trees · '+groveFilter+' ('+ch.length+')'));
      const clr=E('span','clrfil','✕ ver todos');clr.onclick=()=>{groveFilter=null;renderNode('');};hdr.append(clr);}
    else hdr=E('h2','sec','Trees · '+ch.length);
    view.append(hdr);
    if(ch.length)view.append(grid(ch));else view.append(E('div','muted','(ningún Tree con memoria en este Grove)'));
  }
  // memoria del nodo (subtree): HERO + TABS + colapsados.
  // En el home (sin path) NO se vuelca el feed global: solo viñetas de repos.
  const mems=node._mems;
  if(path&&mems.length){
    view.append(E('h2','sec','Cambios'));renderHero(mems,view);
    renderTabs(mems,view);
    renderCollapsed(mems,view);
  }
}

/* ---------- Forest map (Groves → Trees → Branches + grafo) ---------- */
function badge(cls,txt){return E('span','btag'+(cls?' '+cls:''),txt);}
const REL_COLORS={'depends-on':'#79c0ff','extends':'#5fd874','integrates':'#d8b4ff','relates':'#b3bdc8'};
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(t,attrs){const e=document.createElementNS(SVGNS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function buildGraph(repos,rels){
  const groveOf={};(repos||[]).forEach(r=>groveOf[r.name]=r.grove||'');
  const order=(STATE.groves||[]).map(g=>g.id);
  const ids=[...new Set(rels.flatMap(e=>[e.from,e.to]))];
  if(!ids.length)return E('div','muted','(sin relaciones)');
  ids.sort((a,b)=>{const ga=order.indexOf(groveOf[a]),gb=order.indexOf(groveOf[b]);
    return ((ga<0?99:ga)-(gb<0?99:gb))||a.localeCompare(b);});
  const ROWH=30,PADY=22,LABELX=270,RIGHT=320,MAXB=240;
  const yOf={};ids.forEach((id,i)=>yOf[id]=PADY+i*ROWH);
  const H=PADY*2+ids.length*ROWH, W=LABELX+RIGHT;
  const svg=svgEl('svg',{'class':'graph',viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMin meet'});
  const defs=svgEl('defs');
  Object.entries(REL_COLORS).forEach(([t,c])=>{const mk=svgEl('marker',{id:'ar-'+t,markerWidth:7,markerHeight:7,refX:5,refY:3,orient:'auto'});
    mk.append(svgEl('path',{d:'M0,0 L6,3 L0,6 Z',fill:c}));defs.append(mk);});
  svg.append(defs);
  rels.forEach(e=>{const ya=yOf[e.from],yb=yOf[e.to];if(ya==null||yb==null)return;
    const c=REL_COLORS[e.type]||REL_COLORS['relates'];const cx=LABELX-Math.min(40+Math.abs(ya-yb)*0.5,MAXB);
    svg.append(svgEl('path',{d:'M'+LABELX+','+ya+' C'+cx+','+ya+' '+cx+','+yb+' '+LABELX+','+yb,
      fill:'none',stroke:c,'stroke-width':1.5,opacity:.8,'marker-end':'url(#ar-'+e.type+')'}));});
  ids.forEach(id=>{const y=yOf[id];
    svg.append(svgEl('circle',{cx:LABELX,cy:y,r:3.5,fill:'#79c0ff'}));
    const tx=svgEl('text',{x:LABELX+10,y:y+4,fill:'#eef2f6','font-size':12,'font-family':'ui-monospace,monospace'});
    tx.textContent=id+(groveOf[id]?'  · '+groveOf[id]:'');svg.append(tx);});
  const wrap=E('div');const leg=E('div','legend');
  Object.entries(REL_COLORS).forEach(([t,c])=>{const s=E('span');const i=E('i');i.style.borderColor=c;s.append(i,document.createTextNode(t));leg.append(s);});
  wrap.append(svg,leg);return wrap;
}
const GPAL=['#5fd874','#79c0ff','#d8b4ff','#e3b341','#ff8077','#7ee0c0','#f0a3c8','#9fb4ff','#c5e065','#86d0e8'];
function _hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
/* copa estilizada vista de frente (clean dark): tronco + canopy + brillo + sombra */
function drawTreeGlyph(parent,x,y,s,col,title){
  const g=svgEl('g');const ch=18*s,cw=10*s;
  g.append(svgEl('ellipse',{cx:x,cy:y+1.5,rx:cw*0.8,ry:2.4*s,fill:'#000',opacity:.28}));
  g.append(svgEl('rect',{x:x-1.1*s,y:y-6*s,width:2.2*s,height:6*s,fill:'#6b5640'}));
  g.append(svgEl('path',{d:'M'+x+','+(y-ch)+' C'+(x+cw)+','+(y-ch*0.35)+' '+(x+cw*0.7)+','+(y-4*s)+' '+x+','+(y-5*s)+' C'+(x-cw*0.7)+','+(y-4*s)+' '+(x-cw)+','+(y-ch*0.35)+' '+x+','+(y-ch)+' Z',
    fill:col,opacity:.93,stroke:'#0b0f14','stroke-width':0.6}));
  g.append(svgEl('circle',{cx:x-cw*0.25,cy:y-ch*0.55,r:cw*0.3,fill:'#fff',opacity:.16}));
  const ti=svgEl('title');ti.textContent=title;g.append(ti);parent.append(g);
}
/* Forest = paisaje en perspectiva (mixto): Groves = grupos de arbolitos rotulados,
   con profundidad (lejos chico/arriba, cerca grande/abajo). Senderos = relations. */
function homeTree(groves,repos){
  const byG={};repos.forEach(r=>{const k=r.grove||'(sin grove)';(byG[k]=byG[k]||[]).push(r);});
  const metaIds=(groves||[]).map(g=>g.id).filter(id=>byG[id]);
  const order=metaIds.concat(Object.keys(byG).filter(k=>!metaIds.includes(k)));
  if(!order.length)return null;
  const colOf={};order.forEach((id,i)=>colOf[id]=id==='(sin grove)'?'#8893a0':GPAL[i%GPAL.length]);
  const W=920,H=430,horizon=104;
  const svg=svgEl('svg',{'class':'tree',viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet'});
  const defs=svgEl('defs');const grad=svgEl('linearGradient',{id:'gr',x1:0,y1:0,x2:0,y2:1});
  grad.append(svgEl('stop',{offset:'0%','stop-color':'#0e1620'}),svgEl('stop',{offset:'100%','stop-color':'#0a1310'}));
  defs.append(grad);svg.append(defs);
  svg.append(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'#080b10'}));                       // cielo
  svg.append(svgEl('rect',{x:0,y:horizon,width:W,height:H-horizon,fill:'url(#gr)'}));         // suelo
  svg.append(svgEl('line',{x1:0,y1:horizon,x2:W,y2:horizon,stroke:'#2a333f','stroke-width':1}));
  svg.append(svgEl('path',{d:'M0,'+horizon+' q170,-24 340,-4 t340,2 t260,4',fill:'none',stroke:'#1c2430','stroke-width':1,'stroke-dasharray':'2 6'})); // colinas
  svg.append(svgEl('circle',{cx:W-58,cy:44,r:9,fill:'none',stroke:'#3a4655','stroke-width':1,'stroke-dasharray':'2 4'}));                              // luna
  // bandas de profundidad
  const nRows=order.length<=4?2:3;
  const per=Math.ceil(order.length/nRows),pos={};
  order.forEach((gid,i)=>{const row=Math.min(nRows-1,Math.floor(i/per));const tt=nRows>1?row/(nRows-1):0;
    const baseY=horizon+46+tt*(H-horizon-116),scale=0.72+tt*0.5;
    const start=row*per,inBand=order.slice(start,start+per),k=inBand.indexOf(gid),cb=inBand.length;
    const gx=W*(k+1)/(cb+1)+((_hash(gid)%36)-18);
    pos[gid]={x:gx,y:baseY,s:scale};});
  // senderos = relations (agregadas a nivel Grove)
  const seen={};
  (STATE.relations||[]).forEach(e=>{const ga=(repos.find(r=>r.name===e.from)||{}).grove,gb=(repos.find(r=>r.name===e.to)||{}).grove;
    if(!ga||!gb||ga===gb||!pos[ga]||!pos[gb])return;const key=ga+'>'+gb+'>'+e.type;if(seen[key])return;seen[key]=1;
    const a=pos[ga],b=pos[gb],c=REL_COLORS[e.type]||REL_COLORS['relates'];const mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-34;
    svg.append(svgEl('path',{d:'M'+a.x+','+(a.y-4)+' Q'+mx+','+my+' '+b.x+','+(b.y-4),fill:'none',stroke:c,'stroke-width':1.4,opacity:.4,'stroke-dasharray':'5 5'}));});
  // clusters: de atrás (y menor) hacia adelante
  order.slice().sort((p,q)=>pos[p].y-pos[q].y).forEach(gid=>{const g=(groves.find(x=>x.id===gid))||{id:gid};
    const trees=byG[gid],col=colOf[gid],P=pos[gid],s=P.s,sp=15*s,w=(trees.length-1)*sp,x0=P.x-w/2;
    const gg=svgEl('g',{'class':'grovegrp'});if(groveFilter&&gid!==groveFilter)gg.setAttribute('opacity','.28');
    gg.append(svgEl('rect',{'class':'ghit',x:x0-12,y:P.y-30*s,width:w+24,height:64*s,rx:10}));
    trees.forEach((r,j)=>{const tx=x0+j*sp,ty=P.y-((_hash(r.name+gid)%6)-3)*s;
      drawTreeGlyph(gg,tx,ty,s,col,r.name+' · '+gid+(r.vendor?(' · ✎'+r.vendor):''));});
    const lab=svgEl('text',{x:P.x,y:P.y+16*s,fill:col,'font-size':12,'font-weight':'bold','text-anchor':'middle','font-family':'ui-monospace,monospace'});
    lab.textContent=(gid===groveFilter?'◉ ':'')+gid;gg.append(lab);
    const sub=svgEl('text',{x:P.x,y:P.y+28*s,fill:'#9aa6b2','font-size':9.5,'text-anchor':'middle','font-family':'ui-monospace,monospace'});
    sub.textContent=trees.length+'🌳'+(g.kind?(' · '+g.kind):'');gg.append(sub);
    if(gid!=='(sin grove)')gg.onclick=(ev)=>{ev.stopPropagation();selectGrove(gid);};
    svg.append(gg);});
  const wrap=E('div','treehero');svg.style.cursor='pointer';svg.onclick=()=>go('__forest__');
  wrap.append(svg,E('div','treecap','🌲 el Forest — '+metaIds.length+' Groves · '+repos.length+' Trees · click un Grove → filtra abajo · fondo → Forest map'));
  return wrap;
}
function renderForest(){
  const view=$('#view');view.innerHTML='';
  const repos=STATE.repos||[],groves=STATE.groves||[],rels=STATE.relations||[],mt=STATE.metrics||{};
  const m=E('div','metrics');
  m.append(metric(mt.trees||repos.length,'Trees'),metric(mt.groves||groves.length,'Groves'),
    metric(mt.vendors||0,'vendors'),metric(mt.relations||rels.length,'relations'),
    metric(mt.branches_total||mt.worktrees_total||0,'Branches'));
  view.append(m);
  view.append(E('h2','sec','Grafo de relaciones'));
  view.append(buildGraph(repos,rels));
  view.append(E('h2','sec','Groves → Trees → Branches'));
  const gmeta=Object.fromEntries(groves.map(g=>[g.id,g]));
  const by={};repos.forEach(r=>{const k=r.grove||'(sin grove)';(by[k]=by[k]||[]).push(r);});
  const order=groves.map(g=>g.id).filter(id=>by[id]).concat(Object.keys(by).filter(k=>!gmeta[k]));
  order.forEach(gid=>{const g=gmeta[gid]||{id:gid,label:gid};const box=E('div','grove');
    const gt=E('div','gt');gt.append(E('span','gname','🌳 '+(g.label||g.id)));
    if(g.kind)gt.append(badge('kind',g.kind));
    if(g.vendor)gt.append(badge('vendor','✎ '+g.vendor));
    gt.append(E('span','tcount',' '+by[gid].length+' trees'));box.append(gt);
    by[gid].sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{const row=E('div','tree-row');
      row.append(E('span','tn','🪵 '+r.name));
      if(r.kind&&(!g.kind||r.kind!==g.kind))row.append(badge('kind',r.kind));
      if(r.vendor&&(!g.vendor||r.vendor!==g.vendor))row.append(badge('vendor','✎ '+r.vendor));
      (r.worktrees||[]).forEach(wt=>row.append(E('span','brch','🌿 '+wt.branch)));box.append(row);});
    view.append(box);});
}

/* ---------- interacción Forest ---------- */
function selectGrove(gid){
  groveFilter=(groveFilter===gid?null:gid);          // toggle
  if(currentPath())go(''); else renderNode('');       // asegura estar en la home y re-renderiza
  const v=$('#view');if(v&&groveFilter)v.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- routing ---------- */
function go(path){location.hash=path?('#'+path):'#';}
function currentPath(){return decodeURIComponent(location.hash.replace(/^#/,''));}
function route(){const p=currentPath();const fm=(p==='__forest__');
  const nf=$('#navFeed'),ng=$('#navForest');if(nf)nf.classList.toggle('on',!fm);if(ng)ng.classList.toggle('on',fm);
  if(fm)renderForest();else renderNode(p);}
window.addEventListener('hashchange',()=>{if(STATE)route();});

function render(s){
  STATE=s;TREE=buildTree(s.modules||[]);
  STATE._groveByRepo=Object.fromEntries((s.repos||[]).map(r=>[r.name,r.grove]));
  $('#err').textContent='';
  $('#ws').textContent=s.workspace+(s._cache_hit?' · cache':' · fresh');
  $('#stamp').textContent=new Date(s.generated_at).toLocaleTimeString();
  route();
}
async function load(fresh){$('#stamp').innerHTML='<span class="spin"></span>';
  try{const p=new URLSearchParams();if(fresh)p.set('fresh','1');if(TOKEN)p.set('token',TOKEN);
    const r=await fetch('/state.json'+(p.toString()?'?'+p:''));if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());}
  catch(e){$('#err').textContent='Error: '+e.message;$('#stamp').textContent='error';}}
function schedule(){clearInterval(timer);if($('#auto').checked)timer=setInterval(()=>load(false),pollMs);}
$('#refresh').onclick=()=>load(true);
$('#auto').onchange=schedule;
$('#home').onclick=()=>go('');
$('#navFeed').onclick=()=>go('');
$('#navForest').onclick=()=>go('__forest__');
load(true);schedule();
</script>
